[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-eyes"
version = "0.1.0"
description = "A colour bot engine for Runescape."
requires-python = ">=3.9"
# Dependencies are pinned in requirements.txt; install those first.

[tool.setuptools.packages.find]
where = ["python"]
